# On the 1st of each month, builds the "what to plant now" email for each climate region
# from the site's data and posts them as an issue, ready to paste into MailerLite and send.
name: Monthly planting email

on:
  schedule:
    - cron: "0 15 1 * *" # 15:00 UTC on the 1st = 7 or 8 am Pacific
  workflow_dispatch:
    inputs:
      month:
        description: "Month number 1-12 (leave empty for this month)"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  drafts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the emails and post them as an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONTH: ${{ inputs.month }}
        run: |
          if [ -n "$MONTH" ]; then m="$MONTH"; else m=$(TZ=America/Los_Angeles date +%-m); fi
          node scripts/monthly-email.js --month "$m" > body.md
          name=$(node -e 'console.log(require("./assets/plan.js").MONTHS_LONG[+process.argv[1]-1])' "$m")
          gh issue create --title "Monthly planting email: $name $(TZ=America/Los_Angeles date +%Y)" --body-file body.md
